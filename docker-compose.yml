version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: chatapp_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: chatapp
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - chatapp_network

  # Go Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatapp_server
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: chatapp
      SERVER_PORT: 8080
      SERVER_ENV: production
      JWT_SECRET: your_jwt_secret_key_here
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chatapp_network
    restart: unless-stopped

volumes:
  db_data:

networks:
  chatapp_network:
    driver: bridge
